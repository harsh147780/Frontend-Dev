<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <style>
        input {
            padding: 8px;
            margin: 5px 0;
            width: 220px;
            border: 2px solid #ccc;
            outline: none;
        }

        .error {
            color: red;
            font-size: 13px;
        }

        .success {
            color: green;
            font-size: 13px;
        }

        .invalid {
            border-color: red !important;
        }

        .valid {
            border-color: green !important;
        }
    </style>
</head>
<body>
    <form id="regForm">

        <input id="name" placeholder="Name"><br>
        <small id="nameError" class="error"></small><br>

        <input id="email" placeholder="Email"><br>
        <small id="emailError" class="error"></small><br>

        <input id="phone" type="number" placeholder="Mobile Number"><br>
        <small id="phoneError" class="error"></small><br>

        <input id="password" type="password" placeholder="Password"><br>
        <small id="passError" class="error"></small><br>

        <button type="submit">Register</button>
    </form>

    <script>
        class Student {
            constructor(name, email, mobileNumber, password) {
                this.name = name;
                this.email = email;
                this.mobileNumber = mobileNumber;
                this.password = password;
            }
        }

        let Students = [];

        document.getElementById("regForm").onsubmit = function(e) {
            e.preventDefault();

            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let mobileNumber = document.getElementById("phone").value;
            let password = document.getElementById("password").value;

            // Validation Patterns
            let namePattern = /^[A-Za-z ]{3,}$/;
            let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
            let phonePattern = /^[6-9]\d{9}$/;
            let passPattern = /^(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{6,}$/;

            let valid = true;


           if (!namePattern.test(name)) {
    alert("Invalid Name! Name must contain only letters and minimum 3 characters.");
    valid = false;
    return;
}

// Email check
if (!emailPattern.test(email)) {
    alert("Invalid Email!");
    valid = false;
    return;
}

// Phone check
if (!phonePattern.test(mobileNumber)) {
    alert("Invalid Mobile Number! Must be 10 digits and start with 6-9.");
    valid = false;
    return;
}

// Password check
if (!passPattern.test(password)) {
    alert("Invalid Password!\nPassword must contain:\n• 1 Uppercase letter\n• 1 Number\n• 1 Special character\n• Minimum 6 characters");
    valid = false;
    return;
}


            if (valid) {
                let s = new Student(name, email, mobileNumber, password);
                Students.push(s);
                alert("Student Registered Successfully!");
                console.log(Students);
            }
        }
    </script>
</body>
</html>
