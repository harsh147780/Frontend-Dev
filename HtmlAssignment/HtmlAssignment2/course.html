<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Registration Form</title>
</head>
<body>

    <header>
        <h1>Course Registration Form</h1>
        <hr>
    </header>

    <main>
        <form>

            <fieldset>
                <legend><b>Student Information</b></legend>

                <label for="name">Full Name:</label><br>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required><br><br>

                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>
            </fieldset>

            <br>

            <fieldset>
                <legend><b>Course Selection</b></legend>

                <label for="course">Select Course:</label><br>
                <select id="course" name="course" required>
                    <option value="">-- Select a Course --</option>
                    <option value="webdev">Web Development</option>
                    <option value="datasci">Data Science</option>
                    <option value="graphic">Graphic Design</option>
                    <option value="ai">Artificial Intelligence</option>
                    <option value="marketing">Digital Marketing</option>
                </select><br><br>

                <input type="submit" value="Register">
                <input type="reset" value="Clear Form">
            </fieldset>

            <br>

            <fieldset>
                <legend><b>Available Course Schedules</b></legend>
                <table border="1" cellspacing="0" cellpadding="5" width="100%">
                    <thead>
                        <tr>
                            <th>Day</th>
                            <th>Time</th>
                            <th>Instructor</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Monday</td>
                            <td>10:00 AM - 12:00 PM</td>
                            <td>Mr. John Smith</td>
                        </tr>
                        <tr>
                            <td>Wednesday</td>
                            <td>2:00 PM - 4:00 PM</td>
                            <td>Ms. Priya Kapoor</td>
                        </tr>
                        <tr>
                            <td>Friday</td>
                            <td>11:00 AM - 1:00 PM</td>
                            <td>Dr. Amit Sharma</td>
                        </tr>
                    </tbody>
                </table>
            </fieldset>

        </form>
    </main>

    <footer>
        <hr>
        <p>&copy; 2025 Learning Center. All Rights Reserved.</p>
    </footer>

</body>
</html>
